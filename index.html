<!DOCTYPE html>
<html lang="mr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ज्वारी पीक पडताळणी प्रणाली</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="header">
<h1>🌾 ज्वारी पीक पडताळणी</h1>
<p>Crop Verification System</p>
</div>


<!-- शेतकरी -->

<div class="form-group">

<label>शेतकऱ्याचे पूर्ण नाव *</label>

<input
id="farmer"
type="text"
placeholder="शेतकऱ्याचे पूर्ण नाव लिहा">

</div>


<!-- गाव -->

<div class="form-group">

<label>गाव *</label>

<select id="village">

<option value="">-- गाव निवडा --</option>

<option value="कोळविहीर">कोळविहीर</option>
<option value="आष्टोली">आष्टोली</option>
<option value="डोमक">डोमक</option>
<option value="यादवपूर">यादवपूर</option>

</select>

</div>


<!-- सर्वे नंबर -->

<div class="form-group">

<label>गट / सर्वे नंबर *</label>

<input
id="survey"
type="text"
placeholder="उदा. 46/1/अ">

</div>


<!-- क्षेत्र -->

<div class="form-group">

<label>क्षेत्र (हे.आर.)</label>

<input
id="area"
type="text"
placeholder="उदा. 2.50">

</div>


<!-- मोबाईल -->

<div class="form-group">

<label>मोबाईल नंबर</label>

<input
id="mobile"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="मोबाईल नंबर">

</div>


<!-- ई पीक -->

<div class="form-group">

<label>ई-पीक पाहणीतील नोंद *</label>

<select id="eCrop">

<option value="">-- निवडा --</option>

<option value="ज्वारी">ज्वारी</option>

<option value="इतर">इतर</option>

</select>

</div>


<!-- प्रत्यक्ष स्थिती -->

<div class="form-group">

<label>प्रत्यक्ष पाहणीतील स्थिती *</label>

<select id="actualStatus">

<option value="">-- निवडा --</option>

<option value="ज्वारीचे पीक प्रत्यक्ष आहे">
ज्वारीचे पीक प्रत्यक्ष आहे
</option>

<option value="ज्वारीचे पीक प्रत्यक्ष नाही">
ज्वारीचे पीक प्रत्यक्ष नाही
</option>

<option value="काढणी झालेले / अवशेष उपलब्ध">
काढणी झालेले / अवशेष उपलब्ध
</option>

<option value="पुढील चौकशी आवश्यक">
पुढील चौकशी आवश्यक
</option>

</select>

</div>


<!-- स्थानिक बयान -->

<div class="form-group">

<label>स्थानिक शेतकऱ्यांचे बयान</label>

<select id="localStatement">

<option value="होय">होय</option>

<option value="नाही">नाही</option>

</select>

</div>


<!-- पावती -->

<div class="form-group">

<label>खत / बियाणे पावती पाहिली</label>

<select id="receiptChecked">

<option value="होय">होय</option>

<option value="नाही">नाही</option>

</select>

</div>


<!-- अधिकारी -->

<div class="form-group">

<label>पडताळणी अधिकाऱ्याचे नाव</label>

<input
id="officer"
type="text"
placeholder="अधिकाऱ्याचे नाव">

</div>


<!-- शेरा -->

<div class="form-group">

<label>शेरा</label>

<textarea
id="remark"
placeholder="आवश्यक असल्यास शेरा लिहा"></textarea>

</div>


<!-- GPS -->

<div class="gps-box" id="gps">

📍 GPS Location मिळवत आहे...

</div>

<button
type="button"
class="secondary-btn"
id="gpsBtn">

📍 GPS पुन्हा मिळवा

</button>


<!-- फोटो -->

<div class="form-group">

<label>📷 प्रत्यक्ष फोटो *</label>

<input
id="photo"
type="file"
accept="image/*"
capture="environment">

</div>


<img id="preview" alt="फोटो Preview">


<!-- AI RESULT -->

<div id="aiResult" class="ai-box">

🤖 AI पडताळणी: फोटो Submit केल्यानंतर निकाल दिसेल.

</div>


<!-- SUBMIT -->

<button
type="button"
id="submitBtn"
class="submit-btn">

✅ माहिती Submit करा

</button>


<div id="msg"></div>


</div>

</div>


<script src="app.js"></script>

</body>
</html>
