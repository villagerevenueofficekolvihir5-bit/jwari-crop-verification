<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1b5e20">

<title>ज्वारी पीक पडताळणी प्रणाली</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<div class="card">


<!-- =========================================
     HEADER
========================================= -->

<div class="header">

    <div class="government-header">


        <!-- महसूल विभाग लोगो -->

        <div class="logo-box">

            <img
            src="assets/revenue-logo.png"
            alt="महसूल विभाग लोगो"
            class="gov-logo">

        </div>


        <!-- TITLE -->

        <div class="header-title">

            <h1>
                🌾 ज्वारी पीक पडताळणी
            </h1>

            <p>
                Crop Verification System
            </p>

            <small>
                ग्राम महसूल अधिकारी कार्यालय
            </small>

        </div>


        <!-- महाराष्ट्र शासन लोगो -->

        <div class="logo-box">

            <img
            src="assets/maharashtra-logo.png"
            alt="महाराष्ट्र शासन लोगो"
            class="gov-logo">

        </div>


    </div>

</div>



<!-- =========================================
     शेतकरी नाव
========================================= -->

<div class="form-group">

<label>
शेतकऱ्याचे पूर्ण नाव *
</label>

<input
id="farmer"
type="text"
autocomplete="name"
placeholder="शेतकऱ्याचे पूर्ण नाव लिहा">

</div>



<!-- =========================================
     गाव
========================================= -->

<div class="form-group">

<label>
गाव *
</label>

<select id="village">

<option value="">
-- गाव निवडा --
</option>

<option value="कोळविहीर">
कोळविहीर
</option>

<option value="आष्टोली">
आष्टोली
</option>

<option value="डोमक">
डोमक
</option>

<option value="यादवपूर">
यादवपूर
</option>

</select>

</div>



<!-- =========================================
     सर्वे नंबर
========================================= -->

<div class="form-group">

<label>
गट / सर्वे नंबर *
</label>

<input
id="survey"
type="text"
placeholder="उदा. 46/1/अ">

</div>



<!-- =========================================
     क्षेत्र
========================================= -->

<div class="form-group">

<label>
क्षेत्र (हे.आर.)
</label>

<input
id="area"
type="text"
inputmode="decimal"
placeholder="उदा. 2.50">

</div>



<!-- =========================================
     मोबाईल नंबर
========================================= -->

<div class="form-group">

<label>
मोबाईल नंबर
</label>

<input
id="mobile"
type="tel"
inputmode="numeric"
maxlength="10"
placeholder="उदा. 9876543210">

</div>



<!-- =========================================
     ई-पीक
========================================= -->

<div class="form-group">

<label>
ई-पीक पाहणीतील नोंद *
</label>

<select id="eCrop">

<option value="">
-- निवडा --
</option>

<option value="ज्वारी">
ज्वारी
</option>

<option value="इतर">
इतर
</option>

</select>

</div>



<!-- =========================================
     प्रत्यक्ष स्थिती
========================================= -->

<div class="form-group">

<label>
प्रत्यक्ष पाहणीतील स्थिती *
</label>

<select id="actualStatus">

<option value="">
-- निवडा --
</option>

<option value="ज्वारीचे पीक प्रत्यक्ष आहे">
ज्वारीचे पीक प्रत्यक्ष आहे
</option>

<option value="ज्वारीचे पीक प्रत्यक्ष नाही">
ज्वारीचे पीक प्रत्यक्ष नाही
</option>

<option value="काढणी झालेले / अवशेष उपलब्ध">
काढणी झालेले / अवशेष उपलब्ध
</option>

<option value="पुढील चौकशी आवश्यक">
पुढील चौकशी आवश्यक
</option>

</select>

</div>



<!-- =========================================
     स्थानिक शेतकरी बयान
========================================= -->

<div class="form-group">

<label>
स्थानिक शेतकऱ्यांचे बयान
</label>

<select id="localStatement">

<option value="होय">
होय
</option>

<option value="नाही">
नाही
</option>

</select>

</div>



<!-- =========================================
     पावती
========================================= -->

<div class="form-group">

<label>
खत / बियाणे पावती पाहिली
</label>

<select id="receiptChecked">

<option value="होय">
होय
</option>

<option value="नाही">
नाही
</option>

</select>

</div>



<!-- =========================================
     पडताळणी अधिकारी
========================================= -->

<div class="form-group">

<label>
पडताळणी अधिकाऱ्याचे नाव
</label>

<input
id="officer"
type="text"
placeholder="अधिकाऱ्याचे नाव">

</div>



<!-- =========================================
     शेरा
========================================= -->

<div class="form-group">

<label>
शेरा
</label>

<textarea
id="remark"
placeholder="आवश्यक असल्यास शेरा लिहा">
</textarea>

</div>



<!-- =========================================
     GPS
========================================= -->

<div
class="gps-box"
id="gps">

<div class="gps-status">

<span class="gps-icon">
📍
</span>

<span id="gpsText">

GPS Location मिळवत आहे...

</span>

</div>


<div
id="gpsDetails"
class="gps-details">

कृपया Location / GPS ON ठेवा.

</div>

</div>



<button
type="button"
class="secondary-btn"
id="gpsBtn">

📍 GPS पुन्हा मिळवा

</button>



<!-- =========================================
     फोटो
========================================= -->

<div class="form-group">

<label>
📷 प्रत्यक्ष फोटो *
</label>

<input
id="photo"
type="file"
accept="image/*"
capture="environment">

<small class="photo-note">

प्रत्यक्ष शेतातील फोटो कॅमेराद्वारे घ्या.

</small>

</div>



<!-- फोटो Preview -->

<img
id="preview"
alt="फोटो Preview">



<!-- =========================================
     AI RESULT
========================================= -->

<div
id="aiResult"
class="ai-box">

<div class="ai-title">

🤖 AI पडताळणी

</div>

<div id="aiText">

फोटो Submit केल्यानंतर AI पडताळणीचा निकाल दिसेल.

</div>

</div>



<!-- =========================================
     SUBMIT
========================================= -->

<button
type="button"
id="submitBtn"
class="submit-btn">

✅ माहिती Submit करा

</button>



<!-- MESSAGE -->

<div id="msg"></div>



<!-- FOOTER -->

<div class="footer">

<div>

🌾 ज्वारी पीक पडताळणी प्रणाली

</div>

<small>

GPS आधारित प्रत्यक्ष पडताळणी

</small>

</div>


</div>

</div>


<script src="app.js"></script>

</body>

</html>
